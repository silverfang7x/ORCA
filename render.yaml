services:
  - type: web
    name: orca-backend
    env: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm run build:backend
    startCommand: npm --workspace=backend run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: BHASHINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
